plugins { id 'com.android.application' }

def releaseProperties = new Properties()
def releasePropertiesFile = rootProject.file('.tools/signing/release.properties')
if (releasePropertiesFile.exists()) releasePropertiesFile.withInputStream { releaseProperties.load(it) }
def previewInstall = providers.gradleProperty('previewInstall').getOrElse('false').toBoolean()
def officialRelease = providers.gradleProperty('officialRelease').getOrElse('false').toBoolean()
if (officialRelease && !previewInstall) {
    throw new GradleException('Official releases must keep the existing package: add -PpreviewInstall=true')
}

android {
    namespace 'io.mediamaster.app'
    compileSdk 36
    ndkVersion '27.3.13750724'
    defaultConfig {
        applicationId previewInstall ? 'io.mediamaster.app.preview' : 'io.mediamaster.app'
        resValue 'string', 'app_name', '映序'
        minSdk 26
        targetSdk 35
        versionCode 32
        versionName '2.5.1-dev.1'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    signingConfigs {
        localRelease {
            if (releasePropertiesFile.exists()) {
                storeFile file(releaseProperties.getProperty('storeFile'))
                storePassword releaseProperties.getProperty('storePassword')
                keyAlias releaseProperties.getProperty('keyAlias')
                keyPassword releaseProperties.getProperty('keyPassword')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            // Artwork is precompressed losslessly; avoid a second encoder changing sampled pixels.
            crunchPngs false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig !previewInstall && releasePropertiesFile.exists() ? signingConfigs.localRelease : signingConfigs.debug
        }
    }
    packaging { jniLibs { useLegacyPackaging = true } }
    splits {
        abi {
            enable true
            reset()
            if (officialRelease) {
                include 'armeabi-v7a', 'arm64-v8a'
            } else {
                include 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
            }
            universalApk !officialRelease
        }
    }
    testOptions { unitTests.returnDefaultValues = true }
}
dependencies {
    implementation 'androidx.core:core:1.15.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.media3:media3-exoplayer:1.11.1'
    implementation 'androidx.media3:media3-ui:1.11.1'
    implementation('org.videolan.android:libvlc-all:3.7.7') {
        // The app uses its own pull-to-refresh view; LibVLC does not reference this legacy UI module.
        exclude group: 'androidx.swiperefreshlayout', module: 'swiperefreshlayout'
    }
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:rules:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
